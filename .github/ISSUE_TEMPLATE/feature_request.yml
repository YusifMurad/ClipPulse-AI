name: Feature request
description: Suggest a new capability for ClipPulse AI
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case. Who benefits and why?
      placeholder: As a content creator, I want X so that I can Y...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Any mockups or references?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways this could be achieved.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI / clipping
        - Subtitles / captions
        - UI / frontend
        - Backend / API
        - Docker / deployment
        - Docs
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues/ideas for duplicates
          required: true
