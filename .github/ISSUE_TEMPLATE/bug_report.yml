name: Bug report
description: Report a problem with ClipPulse AI
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill this out as completely as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I paste a YouTube link, the server crashes with...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Start the server with `./start.sh`
        2. Paste URL `https://...`
        3. Click "Create Clips"
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Ubuntu 24.04 / macOS 15 / Windows 11 (WSL2)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClipPulse AI version / commit
      placeholder: e.g. main branch, commit 79c046b
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste server output (redact your API key!).
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have redacted my API key from any logs/shared text
          required: true
        - label: I have searched existing issues for duplicates
          required: true
