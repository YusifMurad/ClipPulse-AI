name: Question / Discussion
description: Ask a question or start a discussion
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Got a question? Great. For back-and-forth help, the
        [Discussions](https://github.com/YusifMurad/ClipPulse-AI/discussions) board is usually better —
        but a quick question here is fine too.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What would you like to know?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context (optional)
      description: What are you trying to achieve? OS, setup details, etc.
